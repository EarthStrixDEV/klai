<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --orange:#F2661C;
  --orange-dark:#D8500A;
  --green:#0E8C4B;
  --green-dark:#0A6B3A;
}
*{box-sizing:border-box;}
body{margin:0;}
</style>
</helmet>
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
  <svg viewBox="0 0 240 260" width="100%" height="100%" style="display:block;max-width:100%;max-height:100%;">
    <!-- tail peeking out -->
    <path d="M193 222 Q232 202 219 163 Q238 196 206 236 Z" fill="var(--orange)"></path>

    <!-- body / shoulders -->
    <path d="M54 260 Q50 166 120 158 Q190 166 186 260 Z" fill="var(--orange)"></path>

    <!-- bandana -->
    <path d="M91 160 L149 160 L120 197 Z" fill="var(--green)"></path>
    <circle cx="120" cy="160" r="7" fill="var(--green-dark)"></circle>

    <!-- ears, back shade -->
    <path d="M69 58 Q48 3 92 42 Q85 71 67 79 Z" fill="var(--orange-dark)"></path>
    <path d="M171 58 Q192 3 148 42 Q155 71 173 79 Z" fill="var(--orange-dark)"></path>
    <!-- ears, front -->
    <path d="M76 55 Q59 14 97 44 Q90 69 75 75 Z" fill="var(--orange)"></path>
    <path d="M164 55 Q181 14 143 44 Q150 69 165 75 Z" fill="var(--orange)"></path>
    <!-- inner ears -->
    <path d="M80 50 Q71 25 93 42 Q87 59 79 63 Z" fill="#FFE3C7"></path>
    <path d="M160 50 Q169 25 147 42 Q153 59 161 63 Z" fill="#FFE3C7"></path>

    <!-- head -->
    <circle cx="120" cy="120" r="66" fill="var(--orange)"></circle>

    <!-- cheeks -->
    <ellipse cx="80" cy="140" rx="13" ry="8" fill="#FFB98A" opacity="0.6"></ellipse>
    <ellipse cx="160" cy="140" rx="13" ry="8" fill="#FFB98A" opacity="0.6"></ellipse>

    <!-- muzzle -->
    <ellipse cx="120" cy="142" rx="39" ry="30" fill="#FFF6EA"></ellipse>

    <!-- eyes -->
    <circle cx="97" cy="113" r="7.5" fill="#20231D"></circle>
    <circle cx="143" cy="113" r="7.5" fill="#20231D"></circle>
    <circle cx="99.5" cy="110" r="2.4" fill="#FFFFFF"></circle>
    <circle cx="145.5" cy="110" r="2.4" fill="#FFFFFF"></circle>

    <!-- nose -->
    <ellipse cx="120" cy="136" rx="8.5" ry="6.5" fill="#20231D"></ellipse>

    <!-- mouth -->
    <path d="M104 148 Q120 161 136 148" stroke="#20231D" stroke-width="3.5" fill="none" stroke-linecap="round"></path>

    <!-- paw holding a map pin -->
    <ellipse cx="184" cy="200" rx="21" ry="18" fill="#FFF6EA"></ellipse>
    <g transform="translate(184,156)">
      <path d="M0 0 C-12 0 -19 8 -19 19 C-19 34 0 50 0 50 C0 50 19 34 19 19 C19 8 12 0 0 0 Z" fill="var(--green)"></path>
      <circle cx="0" cy="18" r="7.5" fill="#FFFFFF"></circle>
    </g>
  </svg>
</div>
</x-dc>
</body>
</html>
